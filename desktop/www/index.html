<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>Mbilinyi Tech</title>
<style>
  html,body{margin:0;height:100%;background:#050914;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;text-align:center;padding:24px}
  .logo{width:96px;height:96px;border-radius:24px;background:linear-gradient(135deg,#FF6B2C,#FFB347);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#130A07}
  h1{font-size:22px;margin:0}
  p{color:#9aa3b2;font-size:14px;max-width:320px;margin:0}
  .sp{width:28px;height:28px;border:3px solid rgba(255,255,255,.15);border-top-color:#FF6B2C;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">M</div>
  <h1>Mbilinyi Tech Solutions</h1>
  <p>Inapakia mfumo… / Loading the platform…</p>
  <div class="sp"></div>
</div>
<script>
  // The app loads the live platform, so the phone always runs the current
  // build — no stale copy can be installed on a device.
  window.location.replace('https://mbilinyitech.co.tz/?src=desktop');
</script>
</body>
</html>
