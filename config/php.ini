; Local PHP config for the Mbilinyi Tech Solutions project.
; Optional:  php -c config/php.ini -S 0.0.0.0:12000 -t . router.php
;
; The app runs fine WITHOUT this file — `npm start` does not use it. It only
; pins the timezone and turns on verbose errors for local debugging.
;
; Keep this file portable. Do NOT hard-code extension_dir or absolute Windows
; paths here: an `extension_dir` pointing at one machine makes every
; `extension=` line in the system conf.d fail on another, which silently
; disables PDO and takes the whole site down with "Class PDO not found".
; On Linux/macOS the packaged php.ini already loads PDO, curl and mbstring.

date.timezone = Africa/Dar_es_Salaam

; Local debugging only. Remove these two on a public host.
display_errors = On
error_reporting = E_ALL
log_errors = On

; ---------------------------------------------------------------------------
; Windows only. Uncomment on a Windows dev box and point extension_dir at YOUR
; install (find it with: php -i | findstr extension_dir).
; Leave commented on Linux/macOS and on any shared host.
; ---------------------------------------------------------------------------
; extension_dir = "ext"
; extension = pdo_mysql
; extension = pdo_sqlite
; extension = curl
; extension = mbstring
; extension = openssl

; Windows builds often ship without a CA bundle, so HTTPS calls to an email or
; AI provider fail verification. Point at a local bundle if you hit that.
; Linux hosts have system CAs — leave these commented there.
; curl.cainfo = "C:\xampp\apache\bin\curl-ca-bundle.crt"
; openssl.cafile = "C:\xampp\apache\bin\curl-ca-bundle.crt"
