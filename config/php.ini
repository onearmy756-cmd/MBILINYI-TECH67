; Local PHP config for the Mbilinyi Tech Solutions project.
; Use with:  php -c config\php.ini ...
; Enables the extensions this app needs (MySQL via PDO + cURL for Resend/Ollama).
extension_dir = "C:\Users\STEPHANO AMAN\AppData\Local\Microsoft\WinGet\Packages\PHP.PHP.8.3_Microsoft.Winget.Source_8wekyb3d8bbwe\ext"
extension = pdo_mysql
extension = curl
extension = mbstring
extension = openssl
date.timezone = Africa/Dar_es_Salaam
display_errors = On
error_reporting = E_ALL
log_errors = On

; Local-only: this Windows build ships without a CA bundle, so HTTPS calls to
; Resend / Ollama fail verification. Point at XAMPP's bundle for dev testing.
; Production Linux hosts already have system CAs — delete these two lines there.
curl.cainfo = "C:\xampp\apache\bin\curl-ca-bundle.crt"
openssl.cafile = "C:\xampp\apache\bin\curl-ca-bundle.crt"
