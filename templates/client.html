<!-- ============ CLIENT VIEW ============ -->
<div id="view-client" class="view-section active">
  <div class="max-w-7xl mx-auto px-4 py-8 grid lg:grid-cols-[260px_1fr] gap-5">

        <div class="min-w-0"><div id="clientName" class="font-bold text-[14px] truncate" data-en="Client" data-sw="Mteja">Client</div><div id="clientEmail" class="text-[12px] text-white/50 truncate">—</div><span class="badge bg-cyan-500/10 text-cyan-300 border border-cyan-400/30 mt-1 inline-block" data-en="CLIENT" data-sw="MTEJA">CLIENT</span></div>
      </div>
      <nav class="mt-4 grid gap-1 text-[13.5px] font-semibold" id="clientNav">
        <a data-ctab="overview" href="#overview" onclick="clientTab('overview');return false" class="sidebar-link active text-left px-4 py-3 rounded-xl text-white/70 hover:bg-white/5"><i class="fa-solid fa-grid-2 mr-2 text-cyan-300"></i><span data-en="Overview" data-sw="Muhtasari">Overview</span></a>
        <a data-ctab="requests" href="#requests" onclick="clientTab('requests');return false" class="sidebar-link text-left px-4 py-3 rounded-xl text-white/70 hover:bg-white/5"><i class="fa-solid fa-folder-open mr-2 text-violet-300"></i><span data-en="My Requests" data-sw="Maombi Yangu">My Requests</span></a>
        <a data-ctab="quotes" href="#quotes" onclick="clientTab('quotes');return false" class="sidebar-link text-left px-4 py-3 rounded-xl text-white/70 hover:bg-white/5"><i class="fa-solid fa-file-invoice-dollar mr-2 text-gold"></i><span data-en="Quotations" data-sw="Nukuu za Bei">Quotations</span></a>
        <a data-ctab="contracts" href="#contracts" onclick="clientTab('contracts');return false" class="sidebar-link text-left px-4 py-3 rounded-xl text-white/70 hover:bg-white/5"><i class="fa-solid fa-file-contract mr-2 text-emerald-300"></i><span data-en="Contracts" data-sw="Mikataba">Contracts</span></a>
        <a data-ctab="invoices" href="#invoices" onclick="clientTab('invoices');return false" class="sidebar-link text-left px-4 py-3 rounded-xl text-white/70 hover:bg-white/5"><i class="fa-solid fa-receipt mr-2 text-blue-300"></i><span data-en="Invoices &amp; Pay" data-sw="Ankara na Malipo">Invoices &amp; Pay</span></a>
        <a data-ctab="support" href="#support" onclick="clientTab('support');return false" class="sidebar-link text-left px-4 py-3 rounded-xl text-white/70 hover:bg-white/5"><i class="fa-solid fa-headset mr-2 text-pink-300"></i><span data-en="Support" data-sw="Msaada">Support</span></a>
        <a data-ctab="news" href="#news" onclick="clientTab('news');return false" class="sidebar-link text-left px-4 py-3 rounded-xl text-white/70 hover:bg-white/5"><i class="fa-solid fa-newspaper mr-2 text-cyan-300"></i><span data-en="News &amp; Updates" data-sw="Habari na Taarifa">News &amp; Updates</span></a>
      </nav>
      <button onclick="openQuoteWizard()" class="grad-btn w-full mt-4 py-3 rounded-xl font-bold text-sm"><i class="fa-solid fa-plus mr-1"></i> <span data-en="New Request" data-sw="Ombi Jipya">New Request</span></button>
      <button onclick="logout()" class="w-full mt-2 py-3 rounded-xl font-bold text-sm border border-red-400/30 text-red-300 hover:bg-red-500/10"><i class="fa-solid fa-right-from-bracket mr-1"></i> <span data-en="Logout" data-sw="Toka">Logout</span></button>

    <div class="min-w-0">
      <div class="glass rounded-3xl p-5 md:p-7">
        <div class="flex flex-wrap items-center justify-between gap-3">

          <div class="flex gap-2"><span class="badge bg-emerald-500/15 text-emerald-300 border border-emerald-400/30"><i class="fa-solid fa-circle-check mr-1"></i> <span data-en="BRELA Partner" data-sw="Mshirika wa BRELA">BRELA Partner</span></span><button onclick="showView('landing')" class="text-[12px] px-4 py-2 rounded-full border border-white/15 hover:bg-white/5">← <span data-en="Website" data-sw="Wavuti">Website</span></button></div>
